<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480"><rect width="960" height="480" rx="16" fill="#f3f6fb"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64758b"/></marker></defs><g font-family="Arial,sans-serif" fill="#243249"><text x="35" y="42" font-size="23" font-weight="bold">Rotation preserves the element frame and centre</text><rect x="120" y="137" width="330" height="190" fill="none" stroke="#9eaec3" stroke-dasharray="7 6" stroke-width="2"/><rect x="120" y="137" width="330" height="190" transform="rotate(25 285 232)" fill="#d9f0e9" fill-opacity=".7" stroke="#147c6d" stroke-width="3"/><rect x="95" y="76" width="380" height="312" fill="none" stroke="#b08440" stroke-dasharray="5 5" stroke-width="2"/><circle cx="285" cy="232" r="5" fill="#147c6d"/><text x="535" y="140" font-size="18" fill="#147c6d">Green: rotated object</text><text x="535" y="185" font-size="18" fill="#8294ad">Grey: stored frame (x, y, w, h)</text><text x="535" y="230" font-size="18" fill="#987235">Gold: visible axis-aligned bounds</text><text x="535" y="290" font-size="16">Export the frame plus the rotation angle.</text><text x="535" y="325" font-size="16">Use visible bounds for alignment and warnings.</text><text x="535" y="360" font-size="16">Positive angles rotate clockwise.</text></g></svg>
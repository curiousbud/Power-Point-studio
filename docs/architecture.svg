<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480"><rect width="960" height="480" rx="16" fill="#f3f6fb"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64758b"/></marker></defs><g font-family="Arial,sans-serif" fill="#243249"><text x="35" y="42" font-size="23" font-weight="bold">One model powers the canvas, recovery and exports</text><rect x="40" y="190" width="180" height="90" rx="12" fill="white" stroke="#bbc9d9"/><text x="70" y="227" font-size="18">Visual controls</text><text x="65" y="254" font-size="14">Drag / resize / Inspector</text><rect x="295" y="185" width="250" height="100" rx="12" fill="#d9f0e9" stroke="#147c6d"/><text x="332" y="224" font-size="20">Validated inch model</text><text x="333" y="254" font-size="14">Geometry + content + order</text><path d="M225 235 H290" stroke="#64758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="90" width="235" height="75" rx="12" fill="white" stroke="#bbc9d9"/><text x="703" y="122" font-size="18">Canvas and Inspector</text><text x="703" y="146" font-size="14">View scale only</text><rect x="680" y="200" width="235" height="75" rx="12" fill="white" stroke="#bbc9d9"/><text x="703" y="232" font-size="18">JSON and local autosave</text><text x="703" y="257" font-size="14">Portable / browser-local backup</text><rect x="680" y="310" width="235" height="75" rx="12" fill="white" stroke="#bbc9d9"/><text x="703" y="342" font-size="18">Code and coordinates</text><text x="703" y="367" font-size="14">Python / JS / JSON / VBA</text><path d="M550 235 H605 V128 H675 M605 235 H675 M605 235 V348 H675" fill="none" stroke="#64758b" stroke-width="2" marker-end="url(#arrow)"/><text x="70" y="432" font-size="16">No runtime dependencies, network calls, build pipeline or Office installation required by the editor.</text></g></svg>
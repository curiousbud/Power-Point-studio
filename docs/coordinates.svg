<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480"><rect width="960" height="480" rx="16" fill="#f3f6fb"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64758b"/></marker></defs><g font-family="Arial,sans-serif" fill="#243249"><text x="35" y="42" font-size="23" font-weight="bold">Coordinates belong to the slide, not the screen</text><rect x="90" y="90" width="700" height="320" fill="white" stroke="#bbc9d9" stroke-width="2"/><circle cx="90" cy="90" r="5" fill="#147c6d"/><text x="30" y="75" font-size="15">Origin (0, 0)</text><path d="M100 65 H790" stroke="#64758b" marker-end="url(#arrow)"/><text x="805" y="70" font-size="16">+ X</text><path d="M65 100 V405" stroke="#64758b" marker-end="url(#arrow)"/><text x="30" y="440" font-size="16">+ Y</text><rect x="310" y="200" width="300" height="140" fill="#d9f0e9" stroke="#147c6d" stroke-width="2"/><text x="387" y="265" font-size="19">Element frame</text><text x="340" y="294" font-size="14">X, Y, width, height in document units</text><path d="M95 180 H308" stroke="#64758b" marker-end="url(#arrow)"/><text x="193" y="170" font-size="16">X</text><path d="M290 95 V198" stroke="#64758b" marker-end="url(#arrow)"/><text x="266" y="151" font-size="16">Y</text><path d="M315 360 H610" stroke="#64758b" marker-end="url(#arrow)"/><text x="440" y="386" font-size="16">Width</text><path d="M634 205 V340" stroke="#64758b" marker-end="url(#arrow)"/><text x="646" y="276" font-size="16">Height</text><text x="260" y="454" font-size="16">1 inch = 72 points = 914,400 EMU</text></g></svg>